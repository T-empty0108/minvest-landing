<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lightbox</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            font-family: Arial, sans-serif;
            padding: 50px;
        }
        
        .test-image {
            width: 200px;
            height: 150px;
            background: #1a1a2e;
            border: 2px solid #00a2ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
        }
        
        .test-image img {
            max-width: 100%;
            max-height: 100%;
            pointer-events: none;
        }
        
        /* Lightbox Simple */
        .lightbox-simple-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .lightbox-simple-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-simple-content {
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox-simple-overlay.active .lightbox-simple-content {
            transform: scale(1);
        }

        .lightbox-simple-image {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .lightbox-simple-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #ffffff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #log {
            background: #1a1a2e;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-item {
            margin: 5px 0;
            padding: 5px;
            background: #0a0a0f;
            border-radius: 4px;
        }
        
        .log-success { color: #22c55e; }
        .log-error { color: #ef4444; }
        .log-info { color: #00a2ff; }
    </style>
</head>
<body>
    <h1>Test Lightbox Debug</h1>
    
    <h2>Test 1: Ảnh với data-lightbox-simple</h2>
    <div class="test-image" data-lightbox-simple id="test1">
        <img src="congthuc.jpg" alt="Test 1">
    </div>
    
    <h2>Test 2: Ảnh với data-lightbox-simple (không có ảnh thật)</h2>
    <div class="test-image" data-lightbox-simple id="test2">
        <span>Click me</span>
    </div>
    
    <h2>Log:</h2>
    <div id="log"></div>
    
    <!-- Lightbox Simple Modal -->
    <div class="lightbox-simple-overlay" id="lightbox-simple">
        <div class="lightbox-simple-content">
            <button class="lightbox-simple-close" id="lightbox-simple-close">&times;</button>
            <img src="" alt="Lightbox Image" class="lightbox-simple-image" id="lightbox-simple-image">
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const item = document.createElement('div');
            item.className = 'log-item log-' + type;
            item.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logDiv.insertBefore(item, logDiv.firstChild);
            console.log(message);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded', 'success');
            
            // Check elements exist
            const lightboxSimple = document.getElementById('lightbox-simple');
            const lightboxSimpleImage = document.getElementById('lightbox-simple-image');
            const lightboxSimpleClose = document.getElementById('lightbox-simple-close');
            const benefitImages = document.querySelectorAll('[data-lightbox-simple]');
            
            log('lightbox-simple element: ' + (lightboxSimple ? 'FOUND' : 'NOT FOUND'), lightboxSimple ? 'success' : 'error');
            log('lightbox-simple-image element: ' + (lightboxSimpleImage ? 'FOUND' : 'NOT FOUND'), lightboxSimpleImage ? 'success' : 'error');
            log('lightbox-simple-close element: ' + (lightboxSimpleClose ? 'FOUND' : 'NOT FOUND'), lightboxSimpleClose ? 'success' : 'error');
            log('Elements with [data-lightbox-simple]: ' + benefitImages.length, benefitImages.length > 0 ? 'success' : 'error');
            
            if (lightboxSimple && lightboxSimpleImage) {
                benefitImages.forEach((wrapper, index) => {
                    log('Adding click listener to element ' + index, 'info');
                    
                    wrapper.addEventListener('click', function(e) {
                        log('CLICK detected on element ' + index, 'success');
                        
                        const img = this.querySelector('img');
                        log('Image inside: ' + (img ? img.src : 'NO IMAGE'), img ? 'info' : 'error');
                        
                        if (img) {
                            lightboxSimpleImage.src = img.src;
                            lightboxSimpleImage.alt = img.alt;
                            lightboxSimple.classList.add('active');
                            document.body.style.overflow = 'hidden';
                            log('Lightbox OPENED', 'success');
                        } else {
                            log('No image found, lightbox not opened', 'error');
                        }
                    });
                });
                
                if (lightboxSimpleClose) {
                    lightboxSimpleClose.addEventListener('click', function(e) {
                        e.stopPropagation();
                        lightboxSimple.classList.remove('active');
                        document.body.style.overflow = '';
                        log('Lightbox CLOSED via button', 'info');
                    });
                }
                
                lightboxSimple.addEventListener('click', function(e) {
                    if (e.target === lightboxSimple) {
                        lightboxSimple.classList.remove('active');
                        document.body.style.overflow = '';
                        log('Lightbox CLOSED via overlay', 'info');
                    }
                });
                
                log('Lightbox initialization COMPLETE', 'success');
            } else {
                log('Lightbox initialization FAILED - missing elements', 'error');
            }
        });
    </script>
</body>
</html>
